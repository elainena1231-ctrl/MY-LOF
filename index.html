<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的创作社区</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --border: #eeeeee;
    --text: #222222; --text-2: #666666; --text-3: #999999;
    --primary: #ff5c5c; --shadow: rgba(0,0,0,.06); --hover-bg: #f2f2f2;
  }
  body.dark {
    --bg: #14161a; --card: #1e2126; --border: #2a2e35;
    --text: #e8eaed; --text-2: #a8adb5; --text-3: #7a8088;
    --primary: #ff6b6b; --shadow: rgba(0,0,0,.4); --hover-bg: #262a31;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background .25s, color .25s;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 0; position: sticky; top: 0; z-index: 10;
  }
  .header .container { padding: 0 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { font-size: 19px; font-weight: bold; color: var(--text); text-decoration: none; }
  .logo:hover { color: var(--primary); }
  .main-nav { display: flex; gap: 4px; align-items: center; }
  .main-nav a {
    font-size: 14px; color: var(--text-2); text-decoration: none;
    padding: 8px 14px; border-radius: 999px; transition: all .2s;
    font-weight: 500;
  }
  .main-nav a:hover { background: var(--hover-bg); color: var(--primary); }
  .main-nav a.active { background: var(--primary); color: #fff; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    font-size: 15px; line-height: 1; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s; position: relative;
  }
  .icon-btn:hover { border-color: var(--primary); }
  a.icon-btn { text-decoration: none; }
  .notif-badge {
    position: absolute; top: -4px; right: -4px;
    background: #e33; color: #fff; font-size: 10px;
    padding: 0 5px; border-radius: 999px; min-width: 16px;
    height: 16px; line-height: 16px; text-align: center;
    font-weight: bold;
  }
  .notif-badge.pulse { animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .write-btn {
    padding: 8px 16px; background: var(--primary); color: #fff;
    border-radius: 999px; text-decoration: none; font-size: 13px;
    transition: opacity .2s; white-space: nowrap;
  }
  .write-btn:hover { opacity: .85; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 4px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; color: var(--text-2); cursor: pointer;
    transition: border-color .2s; text-decoration: none;
  }
  .user-chip:hover { border-color: var(--primary); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold;
    object-fit: cover; overflow: hidden; flex-shrink: 0;
  }
  .avatar-sm { width: 20px; height: 20px; font-size: 10px; }

  .mobile-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    z-index: 90;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  .mobile-nav-inner {
    display: flex; align-items: center; justify-content: space-around;
    max-width: 600px; margin: 0 auto;
  }
  .mobile-nav a {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 0;
    text-decoration: none; color: var(--text-3); font-size: 11px;
    transition: color .2s; position: relative;
  }
  .mobile-nav a.active { color: var(--primary); }
  .mobile-nav a .mnav-icon { font-size: 20px; line-height: 1; }
  .mobile-nav a.mnav-write .mnav-icon {
    background: var(--primary); color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-top: -14px;
    box-shadow: 0 4px 12px rgba(255,92,92,.4);
  }
  .mobile-nav a.mnav-write span:last-child { margin-top: 2px; }

  h1 { font-size: 26px; margin-bottom: 6px; }
  h2 { font-size: 18px; margin: 24px 0 12px; }
  .sub { color: var(--text-3); margin-bottom: 24px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; text-decoration: none; color: var(--text-2);
    font-size: 14px; transition: all .2s;
  }
  .tag:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .post {
    display: flex; gap: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 14px;
    text-decoration: none; color: inherit; transition: box-shadow .2s;
  }
  .post:hover { box-shadow: 0 4px 16px var(--shadow); }
  .post img {
    width: 160px; height: 110px; object-fit: cover; border-radius: 8px;
    flex-shrink: 0; background: var(--border);
  }
  .post h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
  .post p { color: var(--text-2); font-size: 14px; margin-bottom: 8px; }
  .post .meta { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .post .meta .author-inline { display: inline-flex; align-items: center; gap: 5px; }
  .back { color: var(--text-2); font-size: 14px; text-decoration: none; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--primary); }
  .empty { text-align: center; color: var(--text-3); padding: 60px 0; }
  .search-bar { margin-bottom: 20px; }
  .search-bar input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-big input { padding: 16px 22px; font-size: 17px; }
  .tabs { display: flex; gap: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab {
    font-size: 14px; color: var(--text-3); cursor: pointer;
    padding: 4px 2px 10px; border-bottom: 2px solid transparent;
    transition: all .2s; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
  .form-group textarea { min-height: 200px; resize: vertical; }
  .form-group textarea.short { min-height: 80px; }
  .form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .tag-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-choice {
    padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; font-size: 14px; cursor: pointer;
    color: var(--text-2); transition: all .2s;
  }
  .tag-choice:hover { border-color: var(--primary); }
  .tag-choice.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .submit-btn {
    padding: 12px 32px; background: var(--primary); color: #fff; border: none;
    border-radius: 999px; font-size: 15px; cursor: pointer; transition: opacity .2s;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary {
    padding: 12px 24px; background: var(--card); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px; font-size: 15px;
    cursor: pointer; margin-left: 8px; transition: all .2s;
  }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .upload-box {
    border: 2px dashed var(--border); border-radius: 12px; padding: 24px;
    text-align: center; cursor: pointer; transition: border-color .2s;
    background: var(--card);
  }
  .upload-box:hover { border-color: var(--primary); }
  .upload-box img { max-width: 100%; max-height: 260px; border-radius: 8px; }
  .upload-box .hint { color: var(--text-3); font-size: 14px; }
  .post-cover { width: 100%; border-radius: 12px; margin-bottom: 20px; cursor: zoom-in; }

  /* ============ 文章布局 + 目录 ============ */
  .post-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .post-main { flex: 1; min-width: 0; }
  .toc-sidebar {
    width: 200px;
    flex-shrink: 0;
    position: sticky;
    top: 90px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
  }
  .toc-title {
    font-weight: 600;
    color: var(--text-2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toc-list { list-style: none; }
  .toc-item {
    padding: 5px 8px;
    border-radius: 6px;
    color: var(--text-2);
    cursor: pointer;
    transition: all .15s;
    line-height: 1.4;
    border-left: 2px solid transparent;
  }
  .toc-item:hover { background: var(--hover-bg); color: var(--primary); }
  .toc-item.active {
    color: var(--primary);
    background: rgba(255,92,92,.08);
    border-left-color: var(--primary);
    font-weight: 500;
  }
  .toc-item.toc-h2 { padding-left: 8px; }
  .toc-item.toc-h3 { padding-left: 22px; font-size: 12px; }
  .toc-item.toc-h4 { padding-left: 34px; font-size: 12px; color: var(--text-3); }
  .toc-empty { color: var(--text-3); font-size: 12px; }

  /* 移动端目录变成顶部按钮 + 抽屉 */
  .toc-mobile-btn {
    display: none;
    padding: 10px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .toc-mobile-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ============ 图片灯箱 ============ */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    cursor: zoom-out;
    animation: lbFadeIn .2s ease;
  }
  @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    cursor: default;
    animation: lbZoomIn .25s ease;
  }
  @keyframes lbZoomIn {
    from { transform: scale(.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lightbox-close {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,.15);
    border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    color: #fff; font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.3); }
  .lightbox-hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.5); font-size: 13px;
    pointer-events: none;
  }

  .post-content { font-size: 16px; color: var(--text-2); line-height: 1.75; }
  .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
    margin: 20px 0 10px; color: var(--text);
    scroll-margin-top: 90px;
  }
  .post-content h1 { font-size: 24px; }
  .post-content h2 { font-size: 20px; }
  .post-content h3 { font-size: 17px; }
  .post-content h4 { font-size: 16px; }
  .post-content blockquote {
    border-left: 3px solid var(--primary); padding-left: 16px;
    color: var(--text-2); margin: 14px 0; font-style: italic;
  }
  .post-content pre {
    background: var(--hover-bg); padding: 14px 18px; border-radius: 8px;
    overflow-x: auto; margin: 14px 0; font-size: 14px; font-family: monospace;
  }
  .post-content ul, .post-content ol { padding-left: 26px; margin: 14px 0; }
  .post-content li { margin-bottom: 6px; }
  .post-content a { color: var(--primary); }
  .post-content img { max-width: 100%; border-radius: 12px; margin: 14px 0; display: block; cursor: zoom-in; }
  .author-link { color: var(--primary); text-decoration: none; }
  .author-link:hover { text-decoration: underline; }
  .action-bar { display: flex; gap: 12px; margin: 28px 0; flex-wrap: wrap; }
  .action-btn {
    padding: 10px 24px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; font-size: 15px; cursor: pointer;
    transition: all .2s; color: var(--text-2);
  }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .action-btn.liked { background: var(--primary); color: #fff; border-color: var(--primary); }
  .action-btn.faved { background: var(--primary); color: #fff; border-color: var(--primary); }
  .action-btn.danger:hover { border-color: #e33; color: #e33; }
  .comments { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
  .comment-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .comment-item .c-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-3); margin-bottom: 6px;
  }
  .comment-item .c-head .c-author-name { color: var(--text-2); }
  .comment-item .c-actions {
    margin-left: auto; display: flex; gap: 10px; font-size: 12px;
  }
  .comment-item .c-actions span { cursor: pointer; color: var(--text-3); }
  .comment-item .c-actions span:hover { color: var(--primary); }
  .comment-item .c-actions .del:hover { color: #e33; }
  .comment-item .c-content { font-size: 15px; color: var(--text); word-break: break-word; }
  .comment-edit-row { display: flex; gap: 8px; margin-top: 4px; }
  .comment-edit-row input {
    flex: 1; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text); outline: none;
  }
  .comment-edit-row input:focus { border-color: var(--primary); }
  .comment-edit-row button {
    padding: 8px 16px; border-radius: 999px; border: none;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .comment-edit-row .save-btn { background: var(--primary); color: #fff; }
  .comment-edit-row .cancel-btn { background: var(--hover-bg); color: var(--text-2); }
  .comment-form { display: flex; gap: 8px; margin-top: 16px; }
  .comment-form input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 14px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .comment-form input:focus { border-color: var(--primary); }
  .comment-form button {
    padding: 10px 24px; background: var(--primary); color: #fff;
    border: none; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .comment-form button:hover { opacity: .85; }
  .follow-btn {
    padding: 8px 22px; background: var(--primary); color: #fff;
    border: 1px solid var(--primary); border-radius: 999px;
    font-size: 14px; cursor: pointer; transition: all .2s;
  }
  .follow-btn:hover { opacity: .85; }
  .follow-btn.followed {
    background: transparent; color: var(--text-2); border-color: var(--border);
  }
  .tag-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h2 { margin: 0; }
  .mini-btn {
    padding: 6px 16px; font-size: 13px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-2); cursor: pointer;
    text-decoration: none; transition: all .2s; display: inline-block;
  }
  .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mini-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .mini-btn.primary:hover { opacity: .85; color: #fff; }
  .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .collection-card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
    transition: box-shadow .2s;
  }
  .collection-card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .collection-cover {
    width: 100%; height: 120px; object-fit: cover; background: var(--border);
    display: block;
  }
  .collection-body { padding: 12px 14px; }
  .collection-body h3 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
  .collection-body p { font-size: 13px; color: var(--text-3); }
  .collection-header {
    display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .collection-header .ch-cover {
    width: 200px; height: 140px; border-radius: 12px; object-fit: cover;
    background: var(--border); flex-shrink: 0;
  }
  .collection-header .ch-info { flex: 1; min-width: 200px; }
  .collection-header h1 { margin-bottom: 8px; }
  .collection-header .ch-desc { color: var(--text-2); font-size: 14px; margin-bottom: 12px; }
  .collection-header .ch-meta { color: var(--text-3); font-size: 13px; margin-bottom: 12px; }
  .danger-text { color: #e33; font-size: 13px; cursor: pointer; text-decoration: underline; }
  .report-text { color: var(--text-3); font-size: 13px; cursor: pointer; text-decoration: underline; }
  .report-text:hover { color: #e33; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--card); border-radius: 16px; padding: 24px;
    max-width: 440px; width: 100%; max-height: 82vh; overflow-y: auto;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { font-size: 18px; margin-bottom: 6px; }
  .modal .modal-sub { font-size: 13px; color: var(--text-3); margin-bottom: 16px; }
  .coll-list { margin-bottom: 16px; max-height: 340px; overflow-y: auto; }
  .coll-option {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: all .2s;
    background: var(--card);
  }
  .coll-option:hover { border-color: var(--primary); }
  .coll-option.selected { border-color: var(--primary); background: var(--hover-bg); }
  .coll-option.selected .coll-option-name::after {
    content: ' ✓'; color: var(--primary); font-weight: bold;
  }
  .coll-option-name { font-size: 15px; color: var(--text); margin-bottom: 2px; }
  .coll-option-meta { font-size: 12px; color: var(--text-3); }
  .modal-actions { display: flex; gap: 8px; justify-content: space-between; }
  .report-reasons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .report-reason {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 14px; transition: all .2s;
  }
  .report-reason:hover { border-color: var(--primary); }
  .report-reason.selected { border-color: var(--primary); background: rgba(255,92,92,.06); }
  .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 120px 20px; color: var(--text-3); gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-status {
    position: fixed; bottom: 76px; right: 16px;
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; color: var(--text-2);
    box-shadow: 0 4px 16px var(--shadow);

// ==================== 敏感词库 ====================
const SENSITIVE_WORDS = [
  '加微信', '加vx', '加VX', '加qq', '加QQ', '扫码加', '私聊我', '私信我',
  '出售', '代购', '刷单', '兼职', '日入', '月入过万', '躺赚', '返利',
  '点击链接', '点击领取', '免费领取', '领取红包', '优惠券群',
  'V信', '威信', 'weixin', '微信：', 'QQ：', 'Q群',
  '傻逼', '煞笔', '沙比', '草泥马', '操你', '日你',
];
function maskWord(w) {
  if (!w || w.length <= 1) return w;
  if (w.length === 2) return w[0] + '*';
  return w[0] + '*'.repeat(w.length - 2) + w[w.length - 1];
}
function checkContent(text) {
  if (!text) return { ok: true, hits: [] };
  const lower = String(text).toLowerCase();
  const hits = [];
  for (const w of SENSITIVE_WORDS) {
    if (lower.includes(w.toLowerCase())) hits.push(w);
  }
  return { ok: hits.length === 0, hits };
}
function showSensitiveError(hits) {
  const masked = hits.slice(0, 5).map(maskWord).join('、');
  const extra = hits.length > 5 ? ' 等 ' + hits.length + ' 处' : '';
  alert('内容包含不允许的词汇：' + masked + extra + '\n\n请修改后再试。');
}

    const uid = String(currentUser.id);
    const { count, error } = await supabase
      .from('notifications')
      .select('id', { count: 'exact', head: true })
      .eq('user_id', uid).eq('is_read', false);

// ==================== 富文本工具 ====================
function looksLikeHTML(s) { return /<[a-z][\s\S]*>/i.test(s || ''); }
function sanitizeHTML(html) {
  if (!html) return '';
  if (window.DOMPurify) {
    return window.DOMPurify.sanitize(html, {
      ALLOWED_TAGS: ['p','br','strong','em','u','s','blockquote','pre','code',
                     'h1','h2','h3','h4','ul','ol','li','a','img','span','sub','sup','hr'],
      ALLOWED_ATTR: ['href','src','alt','class','style','target','rel'],
      ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|tel):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
    });
  }
  return html;
}
function extractTextFromHTML(html) {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
  tmp.querySelectorAll('p, div, h1, h2, h3, h4, li, blockquote').forEach(el => {
    el.appendChild(document.createTextNode('\n'));
  });
  return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

// ==================== 用户 session ====================
const KEY_USER = 'my_user';

async function hashPassword(password) {
  const data = new TextEncoder().encode(password + 'my-lof-salt-v1');
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function registerUser(loginName, dispName, password) {
  const passwordHash = await hashPassword(password);
  const { data: existing } = await supabase.from('app_users').select('id').eq('login_name', loginName).maybeSingle();
  if (existing) throw new Error('这个登录名已经被使用了，换一个吧');
  const { data, error } = await supabase.from('app_users').insert({

  collections = (cData || []).map(rowToColl);
  tags = (tData || []).map(rowToTag);

    if (me) { currentUser.avatar = me.avatar; currentUser.displayName = me.displayName; saveUser(currentUser); }

function formatRelativeTime(isoStr) {
  if (!isoStr) return '';
  const t = new Date(isoStr).getTime();
  const diff = Math.floor((Date.now() - t) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
  const d = new Date(isoStr);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function createTag(name) {
  const trimmed = name.trim();
  if (!trimmed) throw new Error('标签名不能为空');
  const existing = tags.find(t => t.name === trimmed);
  if (existing) return existing;
  const { data, error } = await supabase.from('tags').insert({
    slug: trimmed, name: trimmed, description: '', created_by: currentUser ? String(currentUser.id) : null,
  }).select().single();
  if (error) {
    if (/duplicate|unique/i.test(error.message)) {
      const { data: all } = await supabase.from('tags').select('*').order('id', { ascending: true });
      tags = (all || []).map(rowToTag);
      const found = tags.find(t => t.name === trimmed);
      if (found) return found;
    }
    throw error;
  }
  const newTag = rowToTag(data); tags.push(newTag); return newTag;
}

// ==================== 文章目录 ====================
function buildTOC() {
  const content = document.querySelector('.post-content');
  if (!content) return;

  // 收集 h1-h4
  const headings = content.querySelectorAll('h1, h2, h3, h4');
  if (headings.length < 2) return; // 太少不显示

  const tocList = [];
  const usedIds = new Set();
  headings.forEach((h, i) => {
    // 生成 id（去重）
    let baseId = 'heading-' + i;
    let id = baseId;
    let n = 0;
    while (usedIds.has(id)) { n++; id = baseId + '-' + n; }
    usedIds.add(id);
    h.id = id;
    const level = parseInt(h.tagName.substring(1), 10); // 1-4
    tocList.push({ id, level, text: h.textContent.trim() });
  });

  // 桌面端侧边栏
  const sidebar = document.getElementById('tocSidebar');
  if (sidebar) {
    sidebar.innerHTML = `
      <div class="toc-title">📖 目录</div>
      <ul class="toc-list">
        ${tocList.map(t => `<li class="toc-item toc-h${t.level}" data-target="${t.id}">${escapeHTML(t.text)}</li>`).join('')}
      </ul>
    `;
    sidebar.style.display = 'block';
    sidebar.querySelectorAll('.toc-item').forEach(el => {
      el.addEventListener('click', () => {
        const target = document.getElementById(el.dataset.target);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // 移动端按钮（点击后滚动到侧边栏目录？不，直接生成一个抽屉？这里简化为直接显示为一个列表弹窗）
  const mobileBtn = document.getElementById('tocMobileBtn');
  if (mobileBtn) {
    mobileBtn.style.display = 'inline-block';
    mobileBtn.textContent = `📖 目录 (${tocList.length})`;
    mobileBtn.addEventListener('click', () => {
      const modal = document.createElement('div');
      modal.className = 'modal-mask';
      modal.innerHTML = `
        <div class="modal">
          <h3>目录</h3>
          <ul class="toc-list" style="margin-top:12px;">
            ${tocList.map(t => `<li class="toc-item toc-h${t.level}" data-target="${t.id}" style="cursor:pointer;">${escapeHTML(t.text)}</li>`).join('')}
          </ul>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      modal.querySelectorAll('.toc-item').forEach(el => {
        el.addEventListener('click', () => {
          const target = document.getElementById(el.dataset.target);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          modal.remove();
        });
      });
    });
  }

  // 滚动高亮
  let scrollListener = null;
  const updateActive = () => {
    let current = null;
    const headerOffset = 100;
    for (const t of tocList) {
      const el = document.getElementById(t.id);
      if (!el) continue;
      const top = el.getBoundingClientRect().top;
      if (top - headerOffset <= 0) current = t.id;
      else break;
    }
    document.querySelectorAll('.toc-item').forEach(el => {
      el.classList.toggle('active', el.dataset.target === current);
    });
  };
  scrollListener = () => { requestAnimationFrame(updateActive); };
  window.addEventListener('scroll', scrollListener, { passive: true });
  updateActive();

  // 页面切换时清理
  window.__tocCleanup = () => {
    if (scrollListener) window.removeEventListener('scroll', scrollListener);
    window.__tocCleanup = null;
  };
}

function cleanupTOC() {
  if (window.__tocCleanup) window.__tocCleanup();
}

function escapeHTML(str) {

  }[c]));
}
function highlight(str, kw) {
  if (!kw) return escapeHTML(str);
  const escaped = escapeHTML(str);
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<span class="highlight">$1</span>');
}

/* ============ 图片上传 ============ */
function compressImageToBlob(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('图片压缩失败')), 'image/jpeg', quality);
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
async function uploadImage(file) {
  if (!currentUser) throw new Error('请先登录');
  const blob = await compressImageToBlob(file, 1200, 0.85);
  const filename = `user-${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { data, error } = await supabase.storage.from('images')
    .upload(filename, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
  if (error) throw error;
  const { data: { publicUrl } } = supabase.storage.from('images').getPublicUrl(data.path);
  return publicUrl;
}
async function uploadAvatar(file) { return await uploadImage(file); }
async function saveAvatar(url) {

    if (!nameCheck.ok) { errBox.innerHTML = `<div class="auth-error">昵称包含不允许的词汇，请换一个</div>`; return; }
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = '注册中…';
    try {
      const user = await registerUser(loginNameVal, displayNameVal, password);
      saveUser({ id: user.id, loginName: user.login_name, displayName: user.display_name, avatar: null });
      location.hash = '#/me'; location.reload();
    } catch (e) {
      errBox.innerHTML = `<div class="auth-error">${escapeHTML(e.message)}</div>`;
      btn.disabled = false; btn.textContent = '注册';
    }
  };
  document.getElementById('registerBtn').addEventListener('click', submit);
}

/* ============ 通知 ============ */
function renderNotifications() {
  cleanupTOC();
  if (!requireLogin('请先登录')) return;
  if (myNotifications.length === 0) {
    app.innerHTML = `<div class="container"><h1>通知</h1><p class="sub">别人给你点赞、评论、收藏、关注时，会出现在这里</p><p class="empty">还没有任何通知</p></div>`;
    return;
  }
  const shown = myNotifications.slice(0, notifVisible);
  const listHTML = shown.map(n => {
    const time = formatRelativeTime(n.createdAt);
    const actorAvatar = avatarHTML(n.actorName, 36);
    let actionText = '', link = '#/';
    if (n.type === 'like') { actionText = `点赞了你的文章《${escapeHTML(n.postTitle || '')}》`; link = n.postId ? '#/post/' + n.postId : '#/'; }
    else if (n.type === 'comment') { actionText = `评论了你的文章《${escapeHTML(n.postTitle || '')}》`; link = n.postId ? '#/post/' + n.postId : '#/'; }
    else if (n.type === 'favorite') { actionText = `收藏了你的文章《${escapeHTML(n.postTitle || '')}》`; link = n.postId ? '#/post/' + n.postId : '#/'; }
    else if (n.type === 'follow') { actionText = `关注了你`; link = '#/user/' + encodeURIComponent(n.actorName); }
    const unreadClass = n.isRead ? '' : 'unread';
    const dot = n.isRead ? '' : '<span class="notif-dot"></span>';
    return `
      <a class="notif-item ${unreadClass}" href="${link}" data-notif-id="${n.id}">
        ${actorAvatar}
        <div class="notif-body">
          <div class="notif-text"><strong>${escapeHTML(n.actorName)}</strong> ${actionText}${dot}</div>
          ${n.content ? `<div class="notif-content">"${escapeHTML(n.content)}"</div>` : ''}
          <div class="notif-time">${time}</div>
        </div>
      </a>
    `;
  }).join('');
  const moreHTML = loadMoreHTML(notifVisible, myNotifications.length, true);

  app.innerHTML = `
    <div class="container">
      <div class="section-head">
        <h1 style="margin:0;">通知</h1>
        ${myUnreadCount > 0 ? `<button class="mini-btn" id="markAllReadBtn">全部标为已读</button>` : ''}
      </div>
      <p class="sub">${myUnreadCount > 0 ? myUnreadCount + ' 条未读' : '全部已读'}</p>
      <div class="notif-list">${listHTML}</div>
      ${moreHTML}
    </div>
  `;

  document.querySelectorAll('.notif-item').forEach(el => {
    el.addEventListener('click', async () => {
      const id = Number(el.dataset.notifId);
      const n = myNotifications.find(x => x.id === id);
      if (n && !n.isRead) {
        n.isRead = true;
        myUnreadCount = myNotifications.filter(x => !x.isRead).length;
        try { await supabase.from('notifications').update({ is_read: true }).eq('id', id); } catch (e) {}
      }
    });
  });
  const markBtn = document.getElementById('markAllReadBtn');
  if (markBtn) markBtn.addEventListener('click', async () => {
    const ids = myNotifications.filter(n => !n.isRead).map(n => n.id);
    if (ids.length === 0) return;
    myNotifications.forEach(n => n.isRead = true);
    myUnreadCount = 0;
    try { await supabase.from('notifications').update({ is_read: true }).in('id', ids); } catch (e) {}
    renderHeader(); renderNotifications();
  });
  bindLoadMore(() => { notifVisible += 30; renderNotifications(); });
}

let searchKeyword = '', searchTab = 'all';
function renderSearch() {
  cleanupTOC();
  app.innerHTML = `
    <div class="container">
      <h1>搜索</h1>
      <p class="sub">找文章、标签、作者</p>
      <div class="search-bar search-big">

      </div>
      <div id="searchResults"></div>
    </div>
  `;
  const input = document.getElementById('bigSearchInput');
  input.value = searchKeyword; input.focus();
  try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  input.addEventListener('input', e => { searchKeyword = e.target.value; searchVisible = PAGE_SIZE; updateSearchResults(); });
  updateSearchResults();
}
function updateSearchResults() {
  const container = document.getElementById('searchResults');
  if (!container) return;
  const rawKw = searchKeyword.trim();
  const kw = rawKw.toLowerCase();
  if (!kw) {
    container.innerHTML = `<div class="search-empty-hint"><div class="big">🔍</div><div class="hint-line">输入关键词开始搜索</div><div class="small">可以搜索文章标题、正文、标签名、作者名</div></div>`;
    return;
  }
  const matchedPosts = posts.filter(p => {
    const contentText = looksLikeHTML(p.content) ? extractTextFromHTML(p.content) : (p.content || '');
    return p.title.toLowerCase().includes(kw) || contentText.toLowerCase().includes(kw) ||
      (p.excerpt || '').toLowerCase().includes(kw) || p.author.toLowerCase().includes(kw) ||
      p.tags.some(s => { const t = tags.find(x => x.slug === s); return t && t.name.toLowerCase().includes(kw); });
  }).sort((a, b) => b.id - a.id);
  const matchedTags = tags.filter(t => t.name.toLowerCase().includes(kw) || (t.desc || '').toLowerCase().includes(kw));
  const authorMap = {};
  posts.forEach(p => {
    if (!authorMap[p.author]) authorMap[p.author] = { name: p.author, postCount: 0, likes: 0 };
    authorMap[p.author].postCount += 1;
    authorMap[p.author].likes += (p.likes || 0);
  });
  const matchedAuthors = Object.values(authorMap).filter(a => a.name.toLowerCase().includes(kw)).sort((a, b) => b.postCount - a.postCount);
  const totalCount = matchedPosts.length + matchedTags.length + matchedAuthors.length;

  let html = `<div class="tabs">
    <span class="tab ${searchTab === 'all' ? 'active' : ''}" data-search-tab="all">全部 (${totalCount})</span>
    <span class="tab ${searchTab === 'posts' ? 'active' : ''}" data-search-tab="posts">文章 (${matchedPosts.length})</span>
    <span class="tab ${searchTab === 'tags' ? 'active' : ''}" data-search-tab="tags">标签 (${matchedTags.length})</span>
    <span class="tab ${searchTab === 'users' ? 'active' : ''}" data-search-tab="users">作者 (${matchedAuthors.length})</span>
  </div>`;

  if (totalCount === 0) {
    html += `<div class="search-empty-hint"><div class="big">😶</div><div class="hint-line">没有找到与「${escapeHTML(rawKw)}」相关的内容</div><div class="small">换个关键词试试</div></div>`;
    container.innerHTML = html; bindSearchTabs(); return;
  }
  const showPosts = searchTab === 'all' || searchTab === 'posts';
  const showTags = searchTab === 'all' || searchTab === 'tags';
  const showUsers = searchTab === 'all' || searchTab === 'users';

  if (showTags && matchedTags.length) {
    html += `<h2>标签 (${matchedTags.length})</h2><div class="tag-grid">${matchedTags.map(t => {
      const count = posts.filter(p => p.tags.includes(t.slug)).length;
      return `<a class="tag-card" href="#/tag/${encodeURIComponent(t.slug)}"><div class="tc-name">#${highlight(t.name, rawKw)}</div><div class="tc-desc">${escapeHTML(t.desc || '')}</div><div class="tc-meta">${count} 篇文章</div></a>`;
    }).join('')}</div>`;
  }
  if (showUsers && matchedAuthors.length) {
    html += `<h2>作者 (${matchedAuthors.length})</h2><div class="tag-grid">${matchedAuthors.map(a => userCardHTML(a.name)).join('')}</div>`;
  }
  if (showPosts && matchedPosts.length) {
    html += `<h2>文章 (${matchedPosts.length})</h2>`;
    const shown = matchedPosts.slice(0, searchVisible);
    html += shown.map(postCardHTML).join('');
    html += loadMoreHTML(searchVisible, matchedPosts.length, true);
  }
  container.innerHTML = html;
  bindSearchTabs();
  bindLoadMore(() => { searchVisible += PAGE_SIZE; updateSearchResults(); });
}
function bindSearchTabs() {
  document.querySelectorAll('.tab[data-search-tab]').forEach(el => {
    el.addEventListener('click', () => { searchTab = el.dataset.searchTab; searchVisible = PAGE_SIZE; updateSearchResults(); });
  });
}

function showReportDialog(post) {
  if (!currentUser) { alert('请先登录'); location.hash = '#/login'; return; }
  if (String(post.userId) === String(currentUser.id)) { alert('不能举报自己的文章'); return; }
  if (myReports.has(post.id)) { alert('你已经举报过这篇文章了，我们会尽快处理'); return; }
  const reasons = ['垃圾广告', '色情低俗', '人身攻击', '虚假信息', '侵犯版权', '其他'];
  const modal = document.createElement('div');
  modal.className = 'modal-mask';
  modal.innerHTML = `
    <div class="modal">
      <h3>举报文章</h3>
      <p class="modal-sub">请选择举报原因。恶意举报会导致你的账号被限制。</p>

      </div>

        <button class="mini-btn" id="reportCancelBtn">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  let selectedReason = '';
  const submitBtn = modal.querySelector('#reportSubmitBtn');
  modal.querySelectorAll('.report-reason').forEach(el => {
    el.addEventListener('click', () => {
      modal.querySelectorAll('.report-reason').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedReason = el.dataset.reason;
      submitBtn.disabled = false;
    });
  });
  submitBtn.addEventListener('click', async () => {

      alert(err.message || '提交失败，请重试');

            <button class="action-btn ${faved ? 'faved' : ''}" id="favBtn">${faved ? '⭐' : '☆'} ${faved ? '已收藏' : '收藏'}</button>
            ${isMine ? `<button class="action-btn" id="collBtn">${collBtnText}</button>` : ''}

            ${isMine ? `<button class="action-btn danger" id="deleteBtn">删除文章</button>` : ''}
          </div>
          <div style="text-align:right;margin-top:-16px;margin-bottom:8px;">${reportBtn}</div>

    coverImg.addEventListener('click', () => openLightbox(coverImg.src));

      if (!confirm('确定删除这篇文章吗？')) return;
      posts = posts.filter(x => x.id !== p.id);
      await removePost(p); location.hash = '#/me';
    });
  }

  const commentList = document.getElementById('commentList');
  if (commentList) {
    commentList.addEventListener('click', async (e) => {
      const span = e.target.closest('span[data-action]');
      if (!span) return;
      const action = span.dataset.action;
      const cid = Number(span.dataset.cid);
      const idx = p.comments.findIndex(c => c.id === cid);
      if (idx === -1) return;
      const c = p.comments[idx];
      if (c.author !== currentName) return;
      if (action === 'del') {
        if (!confirm('确定删除这条评论吗？')) return;
        p.comments.splice(idx, 1);
        renderPost(p.id); await syncPost(p);
      } else if (action === 'edit') {
        const item = commentList.querySelector(`.comment-item[data-cid="${cid}"]`);
        if (!item) return;
        const viewRow = item.querySelector('.c-content');
        const editRow = item.querySelector('.c-edit-row');
        const oldContent = c.content;
        viewRow.style.display = 'none';
        editRow.style.display = 'flex';
        editRow.className = 'c-edit-row comment-edit-row';
        editRow.innerHTML = `<input type="text" value="${escapeHTML(oldContent)}" /><button class="save-btn">保存</button><button class="cancel-btn">取消</button>`;
        const input = editRow.querySelector('input'); input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
        const cancel = () => { viewRow.style.display = ''; editRow.style.display = 'none'; editRow.innerHTML = ''; };
        const save = async () => {
          const newVal = input.value.trim();
          if (!newVal) { alert('评论不能为空'); return; }
          const chk = checkContent(newVal);
          if (!chk.ok) { showSensitiveError(chk.hits); return; }
          c.content = newVal;
          renderPost(p.id); await syncPost(p);
        };
        editRow.querySelector('.cancel-btn').addEventListener('click', cancel);
        editRow.querySelector('.save-btn').addEventListener('click', save);
        input.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') save();
          else if (ev.key === 'Escape') cancel();
        });
      }
    });
  }

  const cBtn = document.getElementById('commentBtn');
  if (cBtn) {
    const doComment = async () => {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;
      const chk = checkContent(content);
      if (!chk.ok) { showSensitiveError(chk.hits); return; }
      p.comments.push({ id: Date.now(), author: currentName, content, date: new Date().toISOString().slice(0, 10) });
      if (p.userId && currentUser) await createNotification({ userId: p.userId, type: 'comment', postId: p.id, postTitle: p.title, content: content.slice(0, 60) });
      renderPost(p.id); await syncPost(p);
    };
    cBtn.addEventListener('click', doComment);
    document.getElementById('commentInput').addEventListener('keydown', e => { if (e.key === 'Enter') doComment(); });
  }
}

let selectedTags = [], coverData = null, quillEditor = null;
function selectLocalImage() {
  const input = document.createElement('input');
  input.setAttribute('type', 'file'); input.setAttribute('accept', 'image/*'); input.click();
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const range = quillEditor.getSelection(true);
      quillEditor.insertText(range.index, '（图片上传中…）');
      quillEditor.setSelection(range.index + 9);
      const url = await uploadImage(file);
      quillEditor.deleteText(range.index, 9);
      quillEditor.insertEmbed(range.index, 'image', url);
      quillEditor.setSelection(range.index + 1);
    } catch (err) {
      alert('图片上传失败：' + (err.message || '请重试'));
      try { const r = quillEditor.getSelection(); if (r) quillEditor.deleteText(r.index - 9, 9); } catch (e) {}
    }
  };
}

      <a class="back" href="${editing ? '#/post/' + editing.id : '#/'}">← 返回</a>
      <h1>${editing ? '编辑文章' : '写文章'}<span class="draft-status" id="draftStatus"></span></h1>
      <p class="sub">${editing ? '修改后点保存' : '发布后会以「' + escapeHTML(displayName()) + '」的身份出现'}</p>
      <div id="draftBannerWrap"></div>
      <div class="form-group"><label>标题</label><input type="text" id="title" placeholder="给你的文章起个标题" value="${editing ? escapeHTML(editing.title) : ''}" /></div>
      <div class="form-group">
        <label>封面图（可选，会自动压缩）</label>
        <div class="upload-box" id="uploadBox">${editing && editing.cover ? `<img src="${editing.cover}" alt="封面预览" />` : `<div class="hint">点击选择图片</div>`}</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" />
      </div>
      <div class="form-group"><label>正文（支持富文本：标题、加粗、列表、引用、图片）</label><div id="editor"></div></div>
      <div class="form-group">
        <label>选择标签（可多选）</label>
        <div class="tag-choices" id="tagChoices">${tagChoicesHTML()}</div>
        <div class="new-tag-row">
          <input type="text" id="newTagInput" placeholder="输入新标签名，例如：旅行" maxlength="20" />
          <button type="button" class="mini-btn" id="addTagBtn">+ 添加</button>
        </div>
        <p class="form-hint">输入后点「添加」，新标签会立刻出现在上面并自动选中。</p>
      </div>
      <div class="form-group">
        <label>加入合集（可选）</label>
        <select id="collSelect"><option value="">不加入合集</option>${collOptions}</select>
        ${myColls.length === 0 ? `<p style="font-size:13px;color:var(--text-3);margin-top:6px;">你还没有合集，<a href="#/collection/new" style="color:var(--primary);">点这里创建</a></p>` : ''}
      </div>
      <button class="submit-btn" id="submitBtn">${editing ? '保存修改' : '发布'}</button>
      <button class="btn-secondary" id="clearDraftBtn">清空草稿</button>
    </div>
  `;

  quillEditor = new window.Quill('#editor', {
    theme: 'snow',
    placeholder: '写点什么吧…… 点工具栏的图片图标可以插入图片到正文',
    modules: {
      toolbar: {
        container: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          ['blockquote', 'code-block'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          [{ color: [] }, { background: [] }],
          ['link', 'image'],
          ['clean'],
        ],
        handlers: { image: () => selectLocalImage() },
      },
    },
  });
  if (editing) {
    if (looksLikeHTML(editing.content)) quillEditor.clipboard.dangerouslyPasteHTML(editing.content);
    else quillEditor.setText(editing.content || '');
  }
  bindTagChoiceEvents();

  const draft = loadDraft(currentDraftEditingId);
  if (draft) {
    const bannerWrap = document.getElementById('draftBannerWrap');
    const t = formatRelativeTime(draft.savedAt);
    bannerWrap.innerHTML = `
      <div class="draft-banner">
        <div class="draft-msg">📝 检测到未发布的草稿（保存于 ${t}）</div>
        <button class="restore-btn" id="restoreDraftBtn">恢复草稿</button>
        <button class="discard-btn" id="discardDraftBtn">丢弃</button>
      </div>
    `;
    document.getElementById('restoreDraftBtn').addEventListener('click', () => {
      if (draft.title !== undefined) document.getElementById('title').value = draft.title;
      if (draft.content !== undefined) quillEditor.root.innerHTML = draft.content;
      if (draft.tags) { selectedTags = draft.tags.slice(); const container = document.getElementById('tagChoices'); container.innerHTML = tagChoicesHTML(); bindTagChoiceEvents(); }
      if (draft.cover) { coverData = draft.cover; document.getElementById('uploadBox').innerHTML = `<img src="${coverData}" alt="封面预览" />`; }
      if (draft.collectionId !== undefined) { const sel = document.getElementById('collSelect'); sel.value = draft.collectionId ? String(draft.collectionId) : ''; }
      bannerWrap.innerHTML = ''; showSync('草稿已恢复');
    });
    document.getElementById('discardDraftBtn').addEventListener('click', () => {
      if (!confirm('丢弃草稿后就找不回了，确定？')) return;
      clearDraft(currentDraftEditingId); bannerWrap.innerHTML = ''; showSync('草稿已丢弃');
    });
  }

  function doAutosave() {
    if (!currentUser) return;
    const titleVal = document.getElementById('title').value;
    const contentHTML = quillEditor.root.innerHTML;
    const collVal = document.getElementById('collSelect').value;
    const draftData = {
      title: titleVal, content: contentHTML, tags: selectedTags.slice(),
      cover: coverData, collectionId: collVal ? Number(collVal) : null,
      savedAt: new Date().toISOString(),
    };
    const contentText = extractTextFromHTML(contentHTML);
    if (!titleVal.trim() && !contentText) { try { localStorage.removeItem(currentDraftKey); } catch (e) {} return; }
    try {
      localStorage.setItem(currentDraftKey, JSON.stringify(draftData));
      const st = document.getElementById('draftStatus');
      if (st) st.textContent = '· 已自动保存 ' + new Date().toLocaleTimeString().slice(0, 5);
    } catch (e) {}
  }
  function scheduleAutosave() { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(doAutosave, 800); }
  quillEditor.on('text-change', scheduleAutosave);
  document.getElementById('title').addEventListener('input', scheduleAutosave);
  document.getElementById('collSelect').addEventListener('change', scheduleAutosave);
  const beforeUnloadHandler = () => { doAutosave(); };
  window.addEventListener('beforeunload', beforeUnloadHandler);

  const newTagInput = document.getElementById('newTagInput');
  const addTagBtn = document.getElementById('addTagBtn');
  const doAddTag = async () => {
    const raw = newTagInput.value.trim(); if (!raw) return;
    const chk = checkContent(raw); if (!chk.ok) { showSensitiveError(chk.hits); return; }
    addTagBtn.disabled = true; addTagBtn.textContent = '添加中…';
    try {
      const tag = await createTag(raw);
      if (!selectedTags.includes(tag.slug)) selectedTags.push(tag.slug);
      const container = document.getElementById('tagChoices'); container.innerHTML = tagChoicesHTML(); bindTagChoiceEvents();
      newTagInput.value = ''; scheduleAutosave();
    } catch (err) { alert('创建标签失败：' + (err.message || '请重试')); }
    finally { addTagBtn.disabled = false; addTagBtn.textContent = '+ 添加'; }
  };
  addTagBtn.addEventListener('click', doAddTag);
  newTagInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAddTag(); } });

  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  uploadBox.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    uploadBox.innerHTML = '<div class="hint">上传中…</div>';
    try { coverData = await uploadImage(file); uploadBox.innerHTML = `<img src="${coverData}" alt="封面预览" />`; scheduleAutosave(); }
    catch (err) { uploadBox.innerHTML = '<div class="hint">上传失败：' + escapeHTML(err.message || '请重试') + '</div>'; coverData = null; }
  });

  document.getElementById('clearDraftBtn').addEventListener('click', () => {
    if (!confirm('清空当前编辑内容并删除草稿？')) return;
    clearDraft(currentDraftEditingId);
    location.hash = currentDraftEditingId ? ('#/post/' + currentDraftEditingId) : '#/';
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const rawHTML = quillEditor.root.innerHTML;
    const contentHTML = sanitizeHTML(rawHTML);
    const contentText = extractTextFromHTML(contentHTML);
    const collVal = document.getElementById('collSelect').value;
    const collectionId = collVal ? Number(collVal) : null;
    if (!title) return alert('请填写标题');
    if (!contentText) return alert('请填写正文');
    if (selectedTags.length === 0) return alert('请至少选择一个标签');
    const titleCheck = checkContent(title); if (!titleCheck.ok) { showSensitiveError(titleCheck.hits); return; }
    const contentCheck = checkContent(contentText); if (!contentCheck.ok) { showSensitiveError(contentCheck.hits); return; }
    const excerpt = contentText.slice(0, 60) + (contentText.length > 60 ? '……' : '');
    if (editing) {
      editing.title = title; editing.content = contentHTML; editing.excerpt = excerpt;
      editing.tags = selectedTags.slice(); editing.collectionId = collectionId;
      if (coverData) editing.cover = coverData;
      await syncPost(editing);
      clearDraft(currentDraftEditingId);
      window.removeEventListener('beforeunload', beforeUnloadHandler);
      location.hash = '#/post/' + editing.id;
    } else {
      const newId = posts.length ? Math.max(...posts.map(p => p.id)) + 1 : 1;
      const newPost = {
        id: newId, title, excerpt, content: contentHTML,
        author: displayName(), tags: selectedTags.slice(),
        cover: coverData || ('https://picsum.photos/seed/' + newId + '/600/400'),
        date: new Date().toISOString().slice(0, 10),
        likes: 0, comments: [], collectionId, userId: currentUser.id,
      };
      posts.push(newPost);
      await syncPost(newPost);
      clearDraft(null);
      window.removeEventListener('beforeunload', beforeUnloadHandler);
      location.hash = '#/post/' + newId;
    }
  });
}

/* ============ 路由 ============ */
function router() {
  if (!loaded) return;
  const hash = location.hash || '#/';
  const parts = hash.slice(2).split('/');
  if (parts[0] !== 'write' && parts[0] !== 'edit') {
    currentDraftKey = null; currentDraftEditingId = null; clearTimeout(autosaveTimer);
  }
  // 路由切换时清理目录滚动监听
  cleanupTOC();

  renderHeader();

  if (parts[0] !== 'search') searchVisible = PAGE_SIZE;
  if (parts[0] !== '') homeVisible = PAGE_SIZE;
  if (parts[0] !== 'tag') tagVisible = PAGE_SIZE;
  if (parts[0] !== 'collection') collectionVisible = PAGE_SIZE;
  if (parts[0] !== 'me') { meVisible = PAGE_SIZE; meFavVisible = PAGE_SIZE; }
  if (parts[0] !== 'notifications') notifVisible = 30;

  if (parts[0] === 'login') renderLogin();
  else if (parts[0] === 'register') renderRegister();
  else if (parts[0] === 'notifications') renderNotifications();
  else if (parts[0] === 'me') renderMe();
  else if (parts[0] === 'write') renderWrite();
  else if (parts[0] === 'edit' && parts[1]) renderWrite(parts[1]);
  else if (parts[0] === 'search') renderSearch();
  else if (parts[0] === 'tags') renderTags();
  else if (parts[0] === 'tag' && parts[1]) renderTag(parts[1]);
  else if (parts[0] === 'post' && parts[1]) renderPost(parts[1]);
  else if (parts[0] === 'user' && parts[1]) renderUser(parts[1]);
  else if (parts[0] === 'collections') renderCollections();
  else if (parts[0] === 'collection' && parts[1] === 'new') renderCollectionEdit();
  else if (parts[0] === 'collection' && parts[1] === 'edit' && parts[2]) renderCollectionEdit(parts[2]);
  else if (parts[0] === 'collection' && parts[1]) renderCollection(parts[1]);
  else renderHome();

  window.scrollTo(0, 0);
}

app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><div>正在加载…</div></div>`;

async function init() {
  try {
    await loadAll();
    router();
    if (currentUser) startPolling();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="container"><div class="empty"><p style="color:#e33;font-size:16px;margin-bottom:12px;">连接数据库失败</p><p style="font-size:13px;color:var(--text-3);">${escapeHTML(e.message || e)}</p></div></div>`;
  }
}

window.addEventListener('hashchange', router);
init();
</script>
