<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的创作社区</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --border: #eeeeee;
    --text: #222222; --text-2: #666666; --text-3: #999999;
    --primary: #ff5c5c; --shadow: rgba(0,0,0,.06); --hover-bg: #f2f2f2;
  }
  body.dark {
    --bg: #14161a; --card: #1e2126; --border: #2a2e35;
    --text: #e8eaed; --text-2: #a8adb5; --text-3: #7a8088;
    --primary: #ff6b6b; --shadow: rgba(0,0,0,.4); --hover-bg: #262a31;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background .25s, color .25s;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 0; position: sticky; top: 0; z-index: 10;
  }
  .header .container { padding: 0 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: bold; color: var(--text); text-decoration: none; }
  .logo:hover { color: var(--primary); }
  .slogan { color: var(--text-3); font-size: 13px; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-link {
    font-size: 14px; color: var(--text-2); text-decoration: none;
    padding: 6px 10px; border-radius: 8px; transition: background .2s;
  }
  .nav-link:hover { background: var(--hover-bg); color: var(--primary); }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 16px; line-height: 1; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .icon-btn:hover { border-color: var(--primary); }
  .write-btn {
    padding: 8px 18px; background: var(--primary); color: #fff;
    border-radius: 999px; text-decoration: none; font-size: 14px;
    transition: opacity .2s; white-space: nowrap;
  }
  .write-btn:hover { opacity: .85; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 6px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; color: var(--text-2); cursor: pointer;
    transition: border-color .2s;
  }
  .user-chip:hover { border-color: var(--primary); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; text-transform: uppercase;
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  h2 { font-size: 18px; margin: 24px 0 12px; }
  .sub { color: var(--text-3); margin-bottom: 24px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; text-decoration: none; color: var(--text-2);
    font-size: 14px; transition: all .2s;
  }
  .tag:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .post {
    display: flex; gap: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 14px;
    text-decoration: none; color: inherit; transition: box-shadow .2s;
  }
  .post:hover { box-shadow: 0 4px 16px var(--shadow); }
  .post img {
    width: 160px; height: 110px; object-fit: cover; border-radius: 8px;
    flex-shrink: 0; background: var(--border);
  }
  .post h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
  .post p { color: var(--text-2); font-size: 14px; margin-bottom: 8px; }
  .post .meta { font-size: 12px; color: var(--text-3); }
  .back { color: var(--text-2); font-size: 14px; text-decoration: none; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--primary); }
  .empty { text-align: center; color: var(--text-3); padding: 60px 0; }
  .search-bar { margin-bottom: 20px; }
  .search-bar input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .tabs { display: flex; gap: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab {
    font-size: 14px; color: var(--text-3); cursor: pointer;
    padding: 4px 2px 10px; border-bottom: 2px solid transparent;
    transition: all .2s; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
  .form-group textarea { min-height: 200px; resize: vertical; }
  .form-group textarea.short { min-height: 80px; }
  .tag-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-choice {
    padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; font-size: 14px; cursor: pointer;
    color: var(--text-2); transition: all .2s;
  }
  .tag-choice:hover { border-color: var(--primary); }
  .tag-choice.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .submit-btn {
    padding: 12px 32px; background: var(--primary); color: #fff; border: none;
    border-radius: 999px; font-size: 15px; cursor: pointer; transition: opacity .2s;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary {
    padding: 12px 24px; background: var(--card); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px; font-size: 15px;
    cursor: pointer; margin-left: 8px; transition: all .2s;
  }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .upload-box {
    border: 2px dashed var(--border); border-radius: 12px; padding: 24px;
    text-align: center; cursor: pointer; transition: border-color .2s;
    background: var(--card);
  }
  .upload-box:hover { border-color: var(--primary); }
  .upload-box img { max-width: 100%; max-height: 260px; border-radius: 8px; }
  .upload-box .hint { color: var(--text-3); font-size: 14px; }
  .post-cover { width: 100%; border-radius: 12px; margin-bottom: 20px; }
  .post-content { font-size: 16px; color: var(--text-2); }
  .author-link { color: var(--primary); text-decoration: none; }
  .author-link:hover { text-decoration: underline; }
  .action-bar { display: flex; gap: 12px; margin: 28px 0; flex-wrap: wrap; }
  .action-btn {
    padding: 10px 24px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; font-size: 15px; cursor: pointer;
    transition: all .2s; color: var(--text-2);
  }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .action-btn.liked { background: var(--primary); color: #fff; border-color: var(--primary); }
  .action-btn.danger:hover { border-color: #e33; color: #e33; }
  .comments { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
  .comment-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .comment-item .c-author { font-size: 13px; color: var(--text-3); margin-bottom: 4px; }
  .comment-item .c-content { font-size: 15px; color: var(--text); }
  .comment-form { display: flex; gap: 8px; margin-top: 16px; }
  .comment-form input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 14px; font-family: inherit;
    background: var(--card); color: var(--text); outline: none;
  }
  .comment-form input:focus { border-color: var(--primary); }
  .comment-form button {
    padding: 10px 24px; background: var(--primary); color: #fff;
    border: none; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .comment-form button:hover { opacity: .85; }
  .follow-btn {
    padding: 8px 22px; background: var(--primary); color: #fff;
    border: 1px solid var(--primary); border-radius: 999px;
    font-size: 14px; cursor: pointer; transition: all .2s;
  }
  .follow-btn:hover { opacity: .85; }
  .follow-btn.followed {
    background: transparent; color: var(--text-2); border-color: var(--border);
  }
  .tag-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h2 { margin: 0; }
  .mini-btn {
    padding: 6px 16px; font-size: 13px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-2); cursor: pointer;
    text-decoration: none; transition: all .2s; display: inline-block;
  }
  .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mini-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .mini-btn.primary:hover { opacity: .85; color: #fff; }
  .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .collection-card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
    transition: box-shadow .2s;
  }
  .collection-card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .collection-cover {
    width: 100%; height: 120px; object-fit: cover; background: var(--border);
    display: block;
  }
  .collection-body { padding: 12px 14px; }
  .collection-body h3 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
  .collection-body p { font-size: 13px; color: var(--text-3); }
  .collection-header {
    display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .collection-header .ch-cover {
    width: 200px; height: 140px; border-radius: 12px; object-fit: cover;
    background: var(--border); flex-shrink: 0;
  }
  .collection-header .ch-info { flex: 1; min-width: 200px; }
  .collection-header h1 { margin-bottom: 8px; }
  .collection-header .ch-desc { color: var(--text-2); font-size: 14px; margin-bottom: 12px; }
  .collection-header .ch-meta { color: var(--text-3); font-size: 13px; margin-bottom: 12px; }
  .danger-text { color: #e33; font-size: 13px; cursor: pointer; text-decoration: underline; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--card); border-radius: 16px; padding: 24px;
    max-width: 440px; width: 100%; max-height: 82vh; overflow-y: auto;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { font-size: 18px; margin-bottom: 6px; }
  .modal .modal-sub { font-size: 13px; color: var(--text-3); margin-bottom: 16px; }
  .coll-list { margin-bottom: 16px; max-height: 340px; overflow-y: auto; }
  .coll-option {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: all .2s;
    background: var(--card);
  }
  .coll-option:hover { border-color: var(--primary); }
  .coll-option.selected { border-color: var(--primary); background: var(--hover-bg); }
  .coll-option.selected .coll-option-name::after {
    content: ' ✓'; color: var(--primary); font-weight: bold;
  }
  .coll-option-name { font-size: 15px; color: var(--text); margin-bottom: 2px; }
  .coll-option-meta { font-size: 12px; color: var(--text-3); }
  .modal-actions { display: flex; gap: 8px; justify-content: space-between; }
  .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 120px 20px; color: var(--text-3); gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-status {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; color: var(--text-2);
    box-shadow: 0 4px 16px var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 200;
  }
  .sync-status.show { opacity: 1; }
  .sync-status.error { color: #e33; border-color: #e33; }
  .auth-card {
    max-width: 400px; margin: 60px auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 8px 32px var(--shadow);
  }
  .auth-card h1 { text-align: center; margin-bottom: 6px; font-size: 24px; }
  .auth-card .auth-sub { text-align: center; color: var(--text-3); font-size: 14px; margin-bottom: 24px; }
  .auth-card .submit-btn { width: 100%; margin-top: 8px; }
  .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-3); }
  .auth-switch a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error {
    background: rgba(227,51,51,.1); color: #e33; padding: 10px 14px;
    border-radius: 8px; font-size: 14px; margin-bottom: 16px;
  }
  .auth-success {
    background: rgba(80,200,120,.15); color: #2a9d5c;
    padding: 12px; border-radius: 8px; font-size: 14px;
  }
  .auth-tip {
    font-size: 13px; color: var(--text-3); margin-top: 16px; text-align: center;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="header">
  <div class="container">
    <a href="#/" class="logo">我的创作社区</a>
    <span class="slogan">标签社区 · 图文创作</span>
    <div class="nav-right" id="navRight"></div>
  </div>
</div>

<div id="app"></div>
<div class="sync-status" id="syncStatus"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ========== 已填入你的 Supabase 信息 ==========
const SUPABASE_URL = 'https://rkrroshmqxzuqyilggjm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-uNERFSmoVIUo1j4DO6cPw_9zpCGKwZ';
// ==============================================

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const tags = [
  { slug: 'illustration', name: '插画', desc: '手绘、板绘、原创插画' },
  { slug: 'photography', name: '摄影', desc: '人像、风景、街拍' },
  { slug: 'writing', name: '写作', desc: '小说、随笔、散文' },
  { slug: 'design', name: '设计', desc: 'UI、平面、角色设计' },
];

let currentUser = null;
let posts = [];
let collections = [];
let loaded = false;
let followedTags = JSON.parse(localStorage.getItem('my_followed_tags') || '[]');
let myLikes = JSON.parse(localStorage.getItem('my_likes') || '[]');

function saveFollows() { localStorage.setItem('my_followed_tags', JSON.stringify(followedTags)); }
function saveLikes() { localStorage.setItem('my_likes', JSON.stringify(myLikes)); }

function displayName() {
  if (!currentUser) return '游客';
  const meta = currentUser.user_metadata || {};
  return meta.username || currentUser.email.split('@')[0];
}

let syncTimer = null;
function showSync(text, isError = false) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function rowToPost(r) {
  return {
    id: r.id, title: r.title, excerpt: r.excerpt || '', content: r.content || '',
    author: r.author, tags: r.tags || [], cover: r.cover, date: r.date,
    likes: r.likes || 0, comments: r.comments || [],
    collectionId: r.collection_id, userId: r.user_id,
  };
}
function postToRow(p) {
  return {
    id: p.id, title: p.title, excerpt: p.excerpt, content: p.content,
    author: p.author, tags: p.tags, cover: p.cover, date: p.date,
    likes: p.likes, comments: p.comments, collection_id: p.collectionId,
    user_id: p.userId,
  };
}
function rowToColl(r) {
  return {
    id: r.id, name: r.name, desc: r.desc_text || '', author: r.author,
    cover: r.cover, date: r.date, userId: r.user_id,
  };
}
function collToRow(c) {
  return {
    id: c.id, name: c.name, desc_text: c.desc, author: c.author,
    cover: c.cover, date: c.date, user_id: c.userId,
  };
}

async function loadAll() {
  const { data: pData, error: pErr } = await supabase.from('posts').select('*').order('id', { ascending: true });
  if (pErr) throw pErr;
  const { data: cData, error: cErr } = await supabase.from('collections').select('*').order('id', { ascending: true });
  if (cErr) throw cErr;
  posts = (pData || []).map(rowToPost);
  collections = (cData || []).map(rowToColl);
  posts.forEach(p => {
    if (p.collectionId && !collections.find(c => c.id === p.collectionId)) p.collectionId = null;
  });
  loaded = true;
}

async function syncPost(p) {
  const { error } = await supabase.from('posts').upsert(postToRow(p));
  if (error) { showSync('同步失败：' + error.message, true); console.error(error); return false; }
  showSync('已同步'); return true;
}
async function removePost(p) {
  const { error } = await supabase.from('posts').delete().eq('id', p.id);
  if (error) { showSync('删除失败：' + error.message, true); return false; }
  showSync('已删除'); return true;
}
async function syncColl(c) {
  const { error } = await supabase.from('collections').upsert(collToRow(c));
  if (error) { showSync('同步失败：' + error.message, true); return false; }
  showSync('已同步'); return true;
}
async function removeColl(c) {
  const { error } = await supabase.from('collections').delete().eq('id', c.id);
  if (error) { showSync('删除失败：' + error.message, true); return false; }
  showSync('已删除'); return true;
}

const app = document.getElementById('app');

if (localStorage.getItem('my_theme') === 'dark') document.body.classList.add('dark');
function updateThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}

function renderHeader() {
  const nav = document.getElementById('navRight');
  const userArea = currentUser
    ? `<div class="user-chip" id="userChip" title="${escapeHTML(currentUser.email)}">
         <div class="avatar">${escapeHTML(displayName()[0])}</div>
         <span>${escapeHTML(displayName())}</span>
       </div>`
    : `<a href="#/login" class="nav-link">登录</a>
       <a href="#/register" class="nav-link" style="background:var(--primary);color:#fff;">注册</a>`;

  nav.innerHTML = `
    <a href="#/collections" class="nav-link">合集广场</a>
    ${currentUser ? `<a href="#/user/${encodeURIComponent(displayName())}" class="nav-link">我的主页</a>` : ''}
    <button class="icon-btn" id="themeBtn" title="切换深色模式">🌙</button>
    <a href="#/write" class="write-btn">✏️ 写文章</a>
    ${userArea}
  `;

  document.getElementById('themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('my_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    updateThemeBtn();
  });
  updateThemeBtn();

  const chip = document.getElementById('userChip');
  if (chip) chip.addEventListener('click', showUserMenu);
}

function showUserMenu() {
  const modal = document.createElement('div');
  modal.className = 'modal-mask';
  modal.innerHTML = `
    <div class="modal" style="max-width:320px;">
      <h3>${escapeHTML(displayName())}</h3>
      <p class="modal-sub">${escapeHTML(currentUser.email)}</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <a href="#/user/${encodeURIComponent(displayName())}" class="mini-btn" style="text-align:center;padding:12px;" id="goProfile">我的主页</a>
        <button class="mini-btn" style="padding:12px;color:#e33;border-color:#e33;" id="logoutBtn">退出登录</button>
        <button class="mini-btn" style="padding:12px;" id="cancelMenu">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  modal.querySelector('#cancelMenu').addEventListener('click', () => modal.remove());
  modal.querySelector('#goProfile').addEventListener('click', () => modal.remove());
  modal.querySelector('#logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    modal.remove();
    location.hash = '#/';
    location.reload();
  });
}

function escapeHTML(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function coverOf(p) { return p.cover || ('https://picsum.photos/seed/' + p.id + '/600/400'); }
function collectionCoverOf(c) { return c.cover || ('https://picsum.photos/seed/coll' + c.id + '/600/400'); }

function postCardHTML(p) {
  const coll = p.collectionId ? collections.find(c => c.id === p.collectionId) : null;
  return `
    <a class="post" href="#/post/${p.id}">
      <img src="${coverOf(p)}" alt="${escapeHTML(p.title)}" />
      <div>
        <h3>${escapeHTML(p.title)}</h3>
        <p>${escapeHTML(p.excerpt)}</p>
        <span class="meta">
          ${escapeHTML(p.author)} · ${p.date} · ♡ ${p.likes} · 💬 ${p.comments.length}
          ${coll ? ' · 📚 ' + escapeHTML(coll.name) : ''}
        </span>
      </div>
    </a>
  `;
}
function collectionCardHTML(c) {
  const count = posts.filter(p => p.collectionId === c.id).length;
  return `
    <a class="collection-card" href="#/collection/${c.id}">
      <img class="collection-cover" src="${collectionCoverOf(c)}" alt="${escapeHTML(c.name)}" />
      <div class="collection-body">
        <h3>📚 ${escapeHTML(c.name)}</h3>
        <p>${count} 篇文章 · ${escapeHTML(c.author)}</p>
      </div>
    </a>
  `;
}

}

let homeSort = 'new';
let homeKeyword = '';
let homeTab = 'all';

function renderHome() {
  const tagHTML = tags.map(t => `<a class="tag" href="#/tag/${t.slug}">#${t.name}</a>`).join('');
  let list = posts.slice();
  if (homeTab === 'following') list = list.filter(p => p.tags.some(s => followedTags.includes(s)));

  const kw = homeKeyword.trim().toLowerCase();
  if (kw) {
    list = list.filter(p =>
      p.title.toLowerCase().includes(kw) ||
      (p.content || '').toLowerCase().includes(kw) ||
      p.author.toLowerCase().includes(kw) ||
      p.tags.some(s => {
        const t = tags.find(x => x.slug === s);
        return t && (t.name.includes(kw) || s.includes(kw));
      })
    );
  }
  if (homeSort === 'hot') list.sort((a, b) => (b.likes + b.comments.length * 2) - (a.likes + a.comments.length * 2));
  else list.sort((a, b) => b.id - a.id);

  let listHTML;
  if (!list.length) {
    if (homeTab === 'following' && followedTags.length === 0) listHTML = `<p class="empty">你还没有关注任何标签</p>`;
    else listHTML = `<p class="empty">${kw ? '没有找到匹配的文章' : '还没有文章，点右上角写一篇吧'}</p>`;
  } else listHTML = list.map(postCardHTML).join('');

  const hotColls = collections.slice().sort((a, b) => {
    const ca = posts.filter(p => p.collectionId === a.id).length;
    const cb = posts.filter(p => p.collectionId === b.id).length;
    return cb - ca;
  }).slice(0, 4);
  const hotCollHTML = hotColls.length ? `<div class="collection-grid">${hotColls.map(collectionCardHTML).join('')}</div>` : '';

  app.innerHTML = `
    <div class="container">
      <h1>发现好内容</h1>
      <p class="sub">按标签和合集找到你感兴趣的内容</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索标题、正文、作者或标签…" value="${escapeHTML(homeKeyword)}" />
      </div>
      <h2>热门标签</h2>
      <div class="tags">${tagHTML}</div>
      ${hotCollHTML ? `
        <div class="section-head"><h2>热门合集</h2><a href="#/collections" class="mini-btn">查看全部 →</a></div>
        ${hotCollHTML}
      ` : ''}
      <h2>文章</h2>
      <div class="tabs">
        <span class="tab ${homeTab === 'all' ? 'active' : ''}" data-tab="all">推荐</span>
        <span class="tab ${homeTab === 'following' ? 'active' : ''}" data-tab="following">我关注的标签</span>
        <span style="flex:1"></span>
        <span class="tab ${homeSort === 'new' ? 'active' : ''}" data-sort="new">最新</span>
        <span class="tab ${homeSort === 'hot' ? 'active' : ''}" data-sort="hot">热门</span>
      </div>
      ${listHTML}
    </div>
  `;

  const input = document.getElementById('searchInput');
  input.addEventListener('input', e => {
    homeKeyword = e.target.value;
    const pos = e.target.selectionStart;
    renderHome();
    const ni = document.getElementById('searchInput');
    ni.focus(); ni.setSelectionRange(pos, pos);
  });
  document.querySelectorAll('.tab[data-tab]').forEach(el => el.addEventListener('click', () => { homeTab = el.dataset.tab; renderHome(); }));
  document.querySelectorAll('.tab[data-sort]').forEach(el => el.addEventListener('click', () => { homeSort = el.dataset.sort; renderHome(); }));
}

let tagSort = 'new';
function renderTag(slug) {
  const tag = tags.find(t => t.slug === slug);
  if (!tag) { app.innerHTML = `<div class="container"><p class="empty">标签不存在</p></div>`; return; }
  const isFollowed = followedTags.includes(slug);
  let list = posts.filter(p => p.tags.includes(slug));
  if (tagSort === 'hot') list.sort((a, b) => (b.likes + b.comments.length * 2) - (a.likes + a.comments.length * 2));
  else list.sort((a, b) => b.id - a.id);
  const listHTML = list.length ? list.map(postCardHTML).join('') : `<p class="empty">这个标签下还没有文章</p>`;

  app.innerHTML = `
    <div class="container">
      <a class="back" href="#/">← 返回首页</a>
      <div class="tag-header">
        <h1 style="margin:0;">#${tag.name}</h1>
        <button class="follow-btn ${isFollowed ? 'followed' : ''}" id="followBtn">${isFollowed ? '已关注' : '+ 关注'}</button>
      </div>
      <p class="sub">${tag.desc} · ${list.length} 篇文章</p>
      <div class="tabs">
        <span class="tab ${tagSort === 'new' ? 'active' : ''}" data-sort="new">最新</span>
        <span class="tab ${tagSort === 'hot' ? 'active' : ''}" data-sort="hot">热门</span>
      </div>
      ${listHTML}
    </div>
  `;
  document.getElementById('followBtn').addEventListener('click', () => {
    if (followedTags.includes(slug)) followedTags = followedTags.filter(s => s !== slug);
    else followedTags.push(slug);
    saveFollows(); renderTag(slug);
  });
  document.querySelectorAll('.tab[data-sort]').forEach(el => el.addEventListener('click', () => { tagSort = el.dataset.sort; renderTag(slug); }));
}

function showCollectionPicker(p) {
  const myColls = collections.filter(c => c.userId === currentUser.id);
  const optionsHTML = myColls.length
    ? myColls.map(c => {
        const count = posts.filter(x => x.collectionId === c.id).length;
        const selected = p.collectionId === c.id ? 'selected' : '';
        return `<div class="coll-option ${selected}" data-id="${c.id}">
          <div class="coll-option-name">📚 ${escapeHTML(c.name)}</div>
          <div class="coll-option-meta">${count} 篇文章</div>
        </div>`;
      }).join('')
    : `<p style="color:var(--text-3);font-size:14px;text-align:center;padding:16px 0;">你还没有创建合集</p>`;

  const modal = document.createElement('div');
  modal.className = 'modal-mask';
  modal.innerHTML = `
    <div class="modal">
      <h3>把文章加入合集</h3>
      <p class="modal-sub">选择要加入的合集。同一篇文章只能在一个合集里。</p>
      <div class="coll-list">
        <div class="coll-option ${!p.collectionId ? 'selected' : ''}" data-id="">
          <div class="coll-option-name">不加入合集</div>
          <div class="coll-option-meta">保持独立文章</div>
        </div>
        ${optionsHTML}
      </div>
      <div class="modal-actions">
        <a href="#/collection/new" class="mini-btn" id="createCollBtn">+ 新建合集</a>
        <button class="mini-btn" id="modalCancel">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  modal.querySelectorAll('.coll-option').forEach(el => {
    el.addEventListener('click', async () => {
      p.collectionId = el.dataset.id ? Number(el.dataset.id) : null;
      modal.remove(); renderPost(p.id); await syncPost(p);
    });
  });
  modal.querySelector('#modalCancel').addEventListener('click', () => modal.remove());
  modal.querySelector('#createCollBtn').addEventListener('click', () => modal.remove());
}

function renderPost(id) {
  const p = posts.find(x => x.id === Number(id));
  if (!p) { app.innerHTML = `<div class="container"><p class="empty">文章不存在</p></div>`; return; }

  const tagHTML = p.tags.map(s => {
    const t = tags.find(x => x.slug === s);
    return t ? `<a class="tag" href="#/tag/${t.slug}">#${t.name}</a>` : '';
  }).join('');
  const liked = myLikes.includes(p.id);
  const isMine = currentUser && p.userId === currentUser.id;
  const coll = p.collectionId ? collections.find(c => c.id === p.collectionId) : null;
  const collBtnText = coll ? '📚 更换合集' : '📚 加入合集';

  const collHTML = coll
    ? `<a href="#/collection/${coll.id}" style="display:inline-block;margin-top:20px;padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text-2);font-size:14px;">
        📚 收录于合集：<strong style="color:var(--primary);">${escapeHTML(coll.name)}</strong> →
      </a>` : '';

  const commentsHTML = p.comments.length
    ? p.comments.map(c => `
        <div class="comment-item">
          <div class="c-author">${escapeHTML(c.author)} · ${c.date}</div>
          <div class="c-content">${escapeHTML(c.content)}</div>
        </div>`).join('')
    : `<p style="color:var(--text-3);font-size:14px;">还没有评论，来说两句吧</p>`;

  const commentForm = currentUser
    ? `<div class="comment-form">
         <input type="text" id="commentInput" placeholder="写下你的评论…" />
         <button id="commentBtn">发送</button>
       </div>`
    : `<p style="color:var(--text-3);font-size:14px;margin-top:12px;"><a href="#/login" style="color:var(--primary);">登录</a> 后可以评论</p>`;

  app.innerHTML = `
    <div class="container">
      <a class="back" href="#/">← 返回首页</a>
      <h1>${escapeHTML(p.title)}</h1>
      <p class="sub">
        <a class="author-link" href="#/user/${encodeURIComponent(p.author)}">${escapeHTML(p.author)}</a>
        · ${p.date}
      </p>
      <img class="post-cover" src="${coverOf(p)}" alt="${escapeHTML(p.title)}" />
      <div class="post-content">${escapeHTML(p.content || p.excerpt).replace(/\n/g, '<br>')}</div>
      <div class="tags" style="margin-top:24px;">${tagHTML}</div>
      ${collHTML}

      <div class="action-bar">
        <button class="action-btn ${liked ? 'liked' : ''}" id="likeBtn">${liked ? '♥' : '♡'} 点赞 ${p.likes}</button>
        ${isMine ? `<button class="action-btn" id="collBtn">${collBtnText}</button>` : ''}
        ${isMine ? `<button class="action-btn" id="editBtn">编辑</button>` : ''}
        ${isMine ? `<button class="action-btn danger" id="deleteBtn">删除文章</button>` : ''}
      </div>

      <div class="comments">
        <h2 style="margin-top:0;">评论 (${p.comments.length})</h2>
        <div>${commentsHTML}</div>
        ${commentForm}
      </div>
    </div>
  `;

  document.getElementById('likeBtn').addEventListener('click', async () => {
    if (myLikes.includes(p.id)) { myLikes = myLikes.filter(x => x !== p.id); p.likes = Math.max(0, p.likes - 1); }
    else { myLikes.push(p.id); p.likes += 1; }
    saveLikes(); renderPost(p.id); await syncPost(p);
  });

  const collBtn = document.getElementById('collBtn');
  if (collBtn) collBtn.addEventListener('click', () => showCollectionPicker(p));

  const editBtn = document.getElementById('editBtn');
  if (editBtn) editBtn.addEventListener('click', () => { location.hash = '#/edit/' + p.id; });

  const delBtn = document.getElementById('deleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (!confirm('确定删除这篇文章吗？')) return;
      posts = posts.filter(x => x.id !== p.id);
      await removePost(p);
      location.hash = '#/';
    });
  }

  const cBtn = document.getElementById('commentBtn');
  if (cBtn) {
    const doComment = async () => {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;
      p.comments.push({ id: Date.now(), author: displayName(), content, date: new Date().toISOString().slice(0, 10) });
      renderPost(p.id); await syncPost(p);
    };
    cBtn.addEventListener('click', doComment);
    document.getElementById('commentInput').addEventListener('keydown', e => { if (e.key === 'Enter') doComment(); });
  }
}

        <div class="ch-info">
          <h1>📚 ${escapeHTML(c.name)}</h1>
          <p class="ch-desc">${escapeHTML(c.desc || '暂无简介')}</p>
          <p class="ch-meta">
            <a class="author-link" href="#/user/${encodeURIComponent(c.author)}">${escapeHTML(c.author)}</a>
            · ${list.length} 篇文章
          </p>
          ${isMine ? `
            <a href="#/collection/edit/${c.id}" class="mini-btn" style="display:inline-block;">编辑</a>
            <span class="danger-text" id="delCollBtn" style="margin-left:12px;">删除合集</span>

      await Promise.all(affected.map(p => syncPost(p)));
      await removeColl(c);
      location.hash = '#/collections';
    });
  }

        <input type="file" id="collFileInput" accept="image/*" style="display:none" />
      </div>
      <button class="submit-btn" id="collSubmitBtn">${editing ? '保存修改' : '创建合集'}</button>
      <button class="btn-secondary" id="collCancelBtn">取消</button>
    </div>
  `;

  const uploadBox = document.getElementById('collUploadBox');
  const fileInput = document.getElementById('collFileInput');
  uploadBox.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    uploadBox.innerHTML = '<div class="hint">压缩中…</div>';
    try {
      collectionCoverData = await compressImage(file, 1200, 0.75);
      uploadBox.innerHTML = `<img src="${collectionCoverData}" alt="封面预览" />`;
    } catch { uploadBox.innerHTML = '<div class="hint">图片处理失败，请换一张</div>'; collectionCoverData = null; }
  });

  document.getElementById('collSubmitBtn').addEventListener('click', async () => {
    const name = document.getElementById('collName').value.trim();
    const desc = document.getElementById('collDesc').value.trim();
    if (!name) return alert('请填写合集名称');

    if (editing) {
      editing.name = name; editing.desc = desc;
      if (collectionCoverData) editing.cover = collectionCoverData;
      await syncColl(editing);
      location.hash = '#/collection/' + editing.id;
    } else {
      const newId = collections.length ? Math.max(...collections.map(c => c.id)) + 1 : 1;
      const coll = {
        id: newId, name, desc, author: displayName(),
        cover: collectionCoverData || ('https://picsum.photos/seed/coll' + newId + '/600/400'),
        date: new Date().toISOString().slice(0, 10),
        userId: currentUser.id,
      };
      collections.push(coll);
      await syncColl(coll);
      location.hash = '#/collection/' + newId;
    }
  });

  document.getElementById('collCancelBtn').addEventListener('click', () => history.back());
}

let selectedTags = [];
let coverData = null;

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderWrite(editId) {
  if (!requireLogin('请先登录后再发布文章')) return;
  const editing = editId ? posts.find(x => x.id === Number(editId)) : null;
  if (editId && (!editing || editing.userId !== currentUser.id)) {
    app.innerHTML = `<div class="container"><p class="empty">文章不存在或没有权限</p></div>`;
    return;
  }

  selectedTags = editing ? editing.tags.slice() : [];
  coverData = null;

  const tagChoices = tags.map(t =>
    `<span class="tag-choice ${selectedTags.includes(t.slug) ? 'active' : ''}" data-slug="${t.slug}">#${t.name}</span>`
  ).join('');

  const myColls = collections.filter(c => c.userId === currentUser.id);
  const currentCollId = editing && editing.collectionId ? editing.collectionId : '';
  const collOptions = myColls.map(c =>
    `<option value="${c.id}" ${currentCollId === c.id ? 'selected' : ''}>📚 ${escapeHTML(c.name)}</option>`
  ).join('');

  app.innerHTML = `
    <div class="container">
      <a class="back" href="${editing ? '#/post/' + editing.id : '#/'}">← 返回</a>
      <h1>${editing ? '编辑文章' : '写文章'}</h1>
      <p class="sub">${editing ? '修改后点保存' : '发布后会以「' + escapeHTML(displayName()) + '」的身份出现'}</p>

      <div class="form-group">
        <label>标题</label>
        <input type="text" id="title" placeholder="给你的文章起个标题" value="${editing ? escapeHTML(editing.title) : ''}" />
      </div>

      <div class="form-group">
        <label>封面图（可选，会自动压缩）</label>
        <div class="upload-box" id="uploadBox">
          ${editing && editing.cover ? `<img src="${editing.cover}" alt="封面预览" />` : `<div class="hint">点击选择图片</div>`}
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" />
      </div>

      <div class="form-group">
        <label>正文</label>
        <textarea id="content" placeholder="写点什么吧……">${editing ? escapeHTML(editing.content || '') : ''}</textarea>
      </div>

      <div class="form-group">
        <label>选择标签（可多选）</label>
        <div class="tag-choices" id="tagChoices">${tagChoices}</div>
      </div>

      <div class="form-group">
        <label>加入合集（可选）</label>
        <select id="collSelect">
          <option value="">不加入合集</option>
          ${collOptions}
        </select>
        ${myColls.length === 0
          ? `<p style="font-size:13px;color:var(--text-3);margin-top:6px;">你还没有合集，<a href="#/collection/new" style="color:var(--primary);">点这里创建</a></p>` : ''}
      </div>

      <button class="submit-btn" id="submitBtn">${editing ? '保存修改' : '发布'}</button>
    </div>
  `;

  document.querySelectorAll('.tag-choice').forEach(el => {
    el.addEventListener('click', () => {
      const slug = el.dataset.slug;
      if (selectedTags.includes(slug)) { selectedTags = selectedTags.filter(s => s !== slug); el.classList.remove('active'); }
      else { selectedTags.push(slug); el.classList.add('active'); }
    });
  });

  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  uploadBox.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    uploadBox.innerHTML = '<div class="hint">压缩中…</div>';
    try {
      coverData = await compressImage(file, 1200, 0.75);
      uploadBox.innerHTML = `<img src="${coverData}" alt="封面预览" />`;
    } catch { uploadBox.innerHTML = '<div class="hint">图片处理失败，请换一张</div>'; coverData = null; }
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const collVal = document.getElementById('collSelect').value;
    const collectionId = collVal ? Number(collVal) : null;

    if (!title) return alert('请填写标题');
    if (!content) return alert('请填写正文');
    if (selectedTags.length === 0) return alert('请至少选择一个标签');

    if (editing) {
      editing.title = title;
      editing.content = content;
      editing.excerpt = content.slice(0, 60) + (content.length > 60 ? '……' : '');
      editing.tags = selectedTags.slice();
      editing.collectionId = collectionId;
      if (coverData) editing.cover = coverData;
      await syncPost(editing);
      location.hash = '#/post/' + editing.id;
    } else {
      const newId = posts.length ? Math.max(...posts.map(p => p.id)) + 1 : 1;
      const newPost = {
        id: newId, title,
        excerpt: content.slice(0, 60) + (content.length > 60 ? '……' : ''),
        content,
        author: displayName(),
        tags: selectedTags.slice(),
        cover: coverData || ('https://picsum.photos/seed/' + newId + '/600/400'),
        date: new Date().toISOString().slice(0, 10),
        likes: 0, comments: [],
        collectionId,
        userId: currentUser.id,
      };
      posts.push(newPost);
      await syncPost(newPost);
      location.hash = '#/post/' + newId;
    }
  });
}

function router() {
  if (!loaded) return;
  renderHeader();

  const hash = location.hash || '#/';
  const parts = hash.slice(2).split('/');

  if (parts[0] === 'login') renderLogin();
  else if (parts[0] === 'register') renderRegister();
  else if (parts[0] === 'write') renderWrite();
  else if (parts[0] === 'edit' && parts[1]) renderWrite(parts[1]);
  else if (parts[0] === 'tag' && parts[1]) renderTag(parts[1]);
  else if (parts[0] === 'post' && parts[1]) renderPost(parts[1]);
  else if (parts[0] === 'user' && parts[1]) renderUser(parts[1]);
  else if (parts[0] === 'collections') renderCollections();
  else if (parts[0] === 'collection' && parts[1] === 'new') renderCollectionEdit();
  else if (parts[0] === 'collection' && parts[1] === 'edit' && parts[2]) renderCollectionEdit(parts[2]);
  else if (parts[0] === 'collection' && parts[1]) renderCollection(parts[1]);
  else renderHome();

  window.scrollTo(0, 0);
}

app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><div>正在加载…</div></div>`;

async function init() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    currentUser = session ? session.user : null;

    supabase.auth.onAuthStateChange((_event, sess) => {
      currentUser = sess ? sess.user : null;
      renderHeader();
    });

    await loadAll();
    router();
  } catch (e) {
    console.error(e);
    app.innerHTML = `
      <div class="container">
        <div class="empty">
          <p style="color:#e33;font-size:16px;margin-bottom:12px;">连接数据库失败</p>
          <p style="font-size:13px;color:var(--text-3);">${escapeHTML(e.message || e)}</p>
        </div>
      </div>`;
  }
}

window.addEventListener('hashchange', router);
init();
</script>
